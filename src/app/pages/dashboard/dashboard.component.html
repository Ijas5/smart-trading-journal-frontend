<div class="dashboard-container">

  <div class="cards">
    <div class="card">
      <h4>Total Trades</h4>
      <p>{{ stats.total_trades || 0 }}</p>
    </div>

    <div class="card green">
      <h4>Wins</h4>
      <p>{{ stats.wins || 0 }}</p>
    </div>

    <div class="card red">
      <h4>Losses</h4>
      <p>{{ stats.losses || 0 }}</p>
    </div>

    <div class="card blue">
      <h4>Net Profit</h4>
      <p>{{ stats.net_profit || 0 }}</p>
    </div>
  </div>
 

  <div class="actions">
    <a routerLink="/add-trade">➕ Add Trade</a>
    <a routerLink="/trades">📄 Trade List</a>
    <a routerLink="/journal">📘 Journal</a>
  </div>

   <div class="chart-box">
  <h3>Equity Curve</h3>
  <canvas id="equityChart"></canvas>
</div>

</div>
